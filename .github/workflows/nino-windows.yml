name: Nino Windows Installer

on:
  push:
    branches: ['**']
    # Une étiquette vX.Y.Z publie l'installateur testé dans une version GitHub (job « release »).
    # GitHub n'applique pas le filtre « paths » aux étiquettes.
    tags: ['v*']
    paths:
      - 'studio/**'
      - '.github/workflows/nino-windows.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/nino-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nino-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell
    working-directory: studio

jobs:
  installer:
    name: Windows x64 - installer, démarrer et désinstaller
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js verrouillé
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Installer et construire sur Windows
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx --test apps/api/test/local-lifecycle.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérifier le lanceur PowerShell 5.1
        run: |
          $ErrorActionPreference = 'Stop'
          $powerShell = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powerShell -NoLogo -NoProfile -NonInteractive -File .\windows\tests\launcher.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $powerShell -NoLogo -NoProfile -NonInteractive -File .\windows\tests\runtime.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $powerShell -NoLogo -NoProfile -NonInteractive -File .\windows\tests\companion.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Préparer le paquet Windows et les runtimes vérifiés
        run: |
          node scripts/build-windows.mjs --output "$env:RUNNER_TEMP\nino-payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiler le véritable installateur EXE
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Compilateur Inno Setup absent du runner.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $revision = $env:GITHUB_SHA.Substring(0, 12)
          & $compiler "/DNinoPayloadDir=$env:RUNNER_TEMP\nino-payload" "/DNinoOutputDir=$env:RUNNER_TEMP\nino-installer" "/DNinoVersion=$version" "/DNinoSourceRevision=$revision" windows\nino.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer, lancer deux fois, arrêter et désinstaller
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem "$env:RUNNER_TEMP\nino-installer\*.exe")
          if ($installer.Count -ne 1) { throw 'Un seul installateur Nino est attendu.' }
          & .\windows\Smoke-Installer.ps1 -InstallerPath $installer[0].FullName -ReportPath "$env:RUNNER_TEMP\nino-installer\windows-smoke.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer[0].Name)" | Set-Content -LiteralPath ($installer[0].FullName + '.sha256') -Encoding ASCII
      - name: Livrer l’installateur testé
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nino-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nino-installer/*.exe
            ${{ runner.temp }}/nino-installer/*.sha256
            ${{ runner.temp }}/nino-installer/windows-smoke.json
          if-no-files-found: error
          retention-days: 30
      - name: Préparer les journaux de diagnostic
        if: always()
        run: |
          $destination = "$env:RUNNER_TEMP\nino-installer"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          if (Test-Path -LiteralPath "$env:LOCALAPPDATA\Nino\logs") {
            Get-ChildItem -LiteralPath "$env:LOCALAPPDATA\Nino\logs" -Filter '*.log' -File | Copy-Item -Destination $destination
          }
      - name: Conserver le diagnostic de l’essai Windows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nino-windows-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nino-installer/*.log
            ${{ runner.temp }}/nino-installer/windows-smoke.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publier la version GitHub
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Récupérer l’installateur testé
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nino-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: release
      - name: Vérifier que l’étiquette correspond à la version de Nino
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(release/*.exe)
          if [ "${#exes[@]}" -ne 1 ]; then echo "Un seul installateur attendu, ${#exes[@]} trouvés." >&2; exit 1; fi
          name="$(basename "${exes[0]}")"
          case "$name" in
            "Nino-Setup-${TAG#v}-"*) ;;
            *) echo "L’étiquette $TAG ne correspond pas à l’installateur $name (version de studio/package.json)." >&2; exit 1 ;;
          esac
          (cd release && sha256sum -c ./*.sha256)
      - name: Créer la version et y joindre l’installateur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/*.exe release/*.sha256 \
            --verify-tag \
            --title "Nino ${TAG#v}" \
            --notes "Installateur Windows 11 x64 construit et vérifié par le workflow Nino Windows Installer (installation, double lancement, arrêt, désinstallation). Comparer l’empreinte avec Get-FileHash -Algorithm SHA256. Guide : studio/docs/windows-installer.md."
