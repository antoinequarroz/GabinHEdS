# Page vitrine nino-studio.postmelo.ch sur le VPS : fichiers statiques servis par nginx, derrière le Caddy existant.
# Lancer depuis ce dossier : docker compose up -d
# Mettre à jour la page : git pull (les fichiers sont lus directement dans site/, sans reconstruction).
name: nino-site
services:
  nino-site:
    image: nginx:1.29-alpine
    container_name: nino-site
    restart: unless-stopped
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Aucun port publié : seul Caddy joint « nino-site:80 » par le réseau Docker partagé.
    networks:
      - caddy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    mem_limit: 32m
    cpus: 0.2
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-antoinequarroz-vitrine_appnet}
