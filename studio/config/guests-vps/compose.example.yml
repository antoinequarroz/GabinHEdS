name: nino-guests-vps
services:
  relay:
    image: alpine/socat:1.8.1.3@sha256:fb3862c949af7c79996d0e514ee96128644d840835ed5368eeecb14a869de361
    container_name: nino-guest-relay
    labels: { nino.owner: guest-gateway }
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    command:
      - "TCP4-LISTEN:18413,bind=${CADDY_DOCKER_GATEWAY},reuseaddr,fork"
      - "TCP4:127.0.0.1:18412"
  turn:
    image: coturn/coturn:4.18.0-r0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    container_name: nino-guest-turn
    labels: { nino.owner: guest-gateway }
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    # The official turnserver binary carries this file capability, even on high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m", "/var/lib/coturn:rw,noexec,nosuid,size=16m"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # Only this guest hostname's certificate directory, never every site's keys.
      - ${GUEST_CERTIFICATE_DIRECTORY}:/nino-tls:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--pidfile=/tmp/turnserver.pid"]
